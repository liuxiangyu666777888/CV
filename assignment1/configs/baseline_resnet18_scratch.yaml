experiment_name: baseline_resnet18_scratch
seed: 42
output_dir: outputs/baseline_resnet18_scratch

data:
  root: ../../data
  images_dir: oxford_pet_images/images
  annotations_dir: oxford_pet_annotations/annotations
  num_classes: 37
  image_size: 224
  num_workers: 4

train:
  batch_size: 32
  epochs: 12
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  freeze_backbone_epochs: 0
  grad_clip_norm: 5.0
  amp: true

model:
  name: resnet18
  pretrained: false
  attention: none
  dropout: 0.2

scheduler:
  name: cosine
  min_lr: 1.0e-6
  warmup_epochs: 1

eval:
  save_confusion_matrix: true
  save_predictions: true
